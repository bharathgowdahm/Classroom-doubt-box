&e.defaultProps)for(r in t=e.defaultProps,t)l[r]===void 0&&(l[r]=t[r]);return{$$typeof:ym,type:e,key:o,ref:u,props:l,_owner:km.current}}var Ri=gm,f=Oc,y=Oc;var Lc=["DSA","OOP","DBMS","OS","Computer Networks","Python","Java","Web Dev","Other"],Em=[{id:1,subject:"DSA",question:"What is the difference between a stack and a queue? I keep mixing up push/pop with enqueue/dequeue during interviews.",anonymous:!0,name:"",time:"12 min ago",status:"Answered"},{id:2,subject:"OOP",question:"Can someone explain polymorphism with a real-life example? The textbook definition just isn't clicking for me.",anonymous:!0,name:"",time:"34 min ago",status:"Answered"},{id:3,subject:"DBMS",question:"Why do we need normalization at all? What actually breaks if I keep everything in one giant table?",anonymous:!0,name:"",time:"1 hr ago",status:"Open"},{id:4,subject:"Python",question:"List comprehension vs a normal for loop — is there a real performance difference, or is it purely a style thing?",anonymous:!1,name:"Aarav",time:"2 hrs ago",status:"Open"},{id:5,subject:"OS",question:"What exactly is a deadlock? I need a simple explanation of the four necessary conditions with an example.",anonymous:!0,name:"",time:"3 hrs ago",status:"Answered"},{id:6,subject:"Web Dev",question:"Flexbox vs Grid — when should I use which one? Every tutorial says 'both', but that doesn't help me decide.",anonymous:!1,name:"Sneha",time:"5 hrs ago",status:"Open"}],_m=[{keywords:["recursion","recursive"],title:"Recursion, demystified",answer:"Recursion is when a function solves a problem by calling itself on a smaller version of the same problem. Every recursive solution needs two parts: a base case (where it stops — e.g. factorial(0) = 1) and a recursive case (where the problem shrinks — e.g. factorial(n) = n × factorial(n-1)). Trace it on paper with n = 3 or 4 and watch the call stack grow and unwind — that single exercise builds more intuition than any definition.",linkLabel:"Recursion — GeeksforGeeks",linkHref:"https://www.geeksforgeeks.org/recursion/"},{keywords:["stack","queue","lifo","fifo"],title:"Stack vs Queue",answer:"A stack is LIFO (Last In, First Out) — think of a stack of plates: push adds to the top, pop removes from the top. A queue is FIFO (First In, First Out) — like a ticket line: enqueue joins the back, dequeue leaves from the front. Stacks power undo buttons and the call stack; queues power printer jobs, BFS traversal, and task scheduling.",linkLabel:"Stack vs Queue — GeeksforGeeks",linkHref:"https://www.geeksforgeeks.org/difference-between-stack-and-queue-data-structures/"},{keywords:["polymorphism","oop","inheritance","encapsulation"],title:"Polymorphism with a real-life example",answer:"Polymorphism means 'many forms' — the same action behaves differently depending on the object. Real-life example: a 'draw' button in a shapes app. Click it on a Circle and you get a circle; on a Square, a square. Same method name, different behavior. In code, a parent reference (Shape s = new Circle()) calls the child's overridden method at runtime — that's runtime polymorphism via method overriding.",linkLabel:"Polymorphism — GeeksforGeeks",linkHref:"https://www.geeksforgeeks.org/polymorphism-in-java/"},{keywords:["normalization","dbms","1nf","2nf","3nf","sql","database"],title:"Why normalization matters",answer:"Without normalization, one giant table causes three anomalies: insertion (can't add a course with no students), update (change a professor's email in 50 rows), and deletion (delete the last student and lose the course info). Normalization splits data into related tables (1NF → atomic values, 2NF → no partial dependency, 3NF → no transitive dependency) so each fact lives in exactly one place.",linkLabel:"DBMS Normalization — GeeksforGeeks",linkHref:"https://www.geeksforgeeks.org/normal-forms-in-dbms/"},{keywords:["deadlock","os","operating system"],title:"Deadlock and its four conditions",answer:"A deadlock is when two or more processes wait forever for resources held by each other. Classic example: Process A holds the printer and wants the scanner; Process B holds the scanner and wants the printer — both freeze. Coffman listed four necessary conditions: mutual exclusion, hold-and-wait, no preemption, and circular wait. Break any one of them (e.g. require processes to request all resources at once) and deadlock becomes impossible.",linkLabel:"Deadlock — GeeksforGeeks",linkHref:"https://www.geeksforgeeks.org/introduction-of-deadlock-in-operating-system/"},{keywords:["pointer","c programming","malloc"],title:"Pointers in C",answer:"A pointer is simply a variable that stores a memory address. `int *p = &x;` means p holds the address of x, and `*p` dereferences it to reach the value. Draw boxes for memory cells and arrows for pointers — every pointer bug (segfaults, dangling pointers) becomes visible when you sketch what points where.",linkLabel:"Pointers in C — GeeksforGeeks",linkHref:"https://www.geeksforgeeks.org/c-pointers/"},{keywords:["big o","complexity","time complexity","sorting","binary search"],title:"Big-O intuition",answer:"Big-O describes how runtime grows as input grows. O(1) is constant (array index), O(log n) halves the problem each step (binary search), O(n) scans once (linear search), O(n log n) is the sorting sweet spot (merge sort), and O(n²) usually means nested loops. Rule of thumb: n = 10⁵ with O(n²) ≈ 10¹⁰ operations is too slow — aim for O(n log n) or better.",linkLabel:"Big-O Analysis — GeeksforGeeks",linkHref:"https://www.geeksforgeeks.org/analysis-of-algorithms-big-o-analysis/"},{keywords:["flexbox","grid","css"],title:"Flexbox vs Grid",answer:"Use flexbox for one-dimensional layouts (a row of nav links, centering a card) — it distributes space along a single axis. Use grid for two-dimensional layouts (a full page skeleton, a photo gallery) — it controls rows and columns together. They compose beautifully: a grid page whose cards internally use flexbox is the standard modern pattern.",linkLabel:"Flexbox — MDN",linkHref:"https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_flexible_box_layout"},{keywords:["list comprehension","python"],title:"List comprehensions in Python",answer:"A list comprehension like `[x*x for x in range(10) if x % 2 == 0]` builds a list in one expressive line. Performance-wise it's slightly faster than an equivalent for loop (roughly 10–30%) because the loop runs in C under the hood, but the real win is readability. Keep them to one condition; anything more complex deserves a proper loop for clarity.",linkLabel:"List Comprehension — GeeksforGeeks",linkHref:"https://www.geeksforgeeks.org/python-list-comprehension/"},{keywords:["git","github","commit","merge","branch"],title:"Git essentials",answer:'Git tracks snapshots of your project. The core loop: `git add` (stage changes) → `git commit -m "message"` (save a snapshot) → `git push` (send to GitHub). Branches (`git branch feature-x`) let you experiment safely; `git merge` folds the work back in. Commit early and often with clear messages — your future self (and recruiters) will thank you.',linkLabel:"Git Tutorial — GeeksforGeeks",linkHref:"https://www.geeksforgeeks.org/git-tutorial/"},{keywords:["api","rest","http","json"],title:"REST APIs in plain words",answer:"A REST API is a contract for talking to a server over HTTP. You hit a URL (endpoint) with a method: GET reads, POST creates, PUT/PATCH updates, DELETE removes. The server replies with JSON — structured text your app can parse. Example: GET https://api.example.com/users returns a JSON list of users. Status codes tell the story: 200 OK, 404 not found, 500 server error.",linkLabel:"REST API — MDN",linkHref:"https://developer.mozilla.org/en-US/docs/Glossary/REST"},{keywords:["machine learning","ml","neural","ai "],title:"Machine learning, simply",answer:"Machine learning is teaching computers to learn patterns from data instead of hand-written rules. Supervised learning maps inputs to known answers (spam vs not-spam); unsupervised l
